# mc-proxy: прокси для Minecraft (TCP) и Simple Voice Chat (UDP)
# Репликация сессий по HTTP с backend (mc-proxy может быть на отдельном VPS).
# SESSIONS_API_URL — полный URL backend, например https://launcher.example.com/api/sessions/export

services:
  mc-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "24454:24454/udp"
    environment:
      MC_BACKEND: "192.168.1.12:25567"
      VOICE_BACKEND: "192.168.1.12:24456"
      MC_LISTEN: ":25565"
      VOICE_LISTEN: ":24454"
      # Репликация сессий с backend (разные хосты)
      SESSIONS_API_URL: "http://backend:8080/api/sessions/export"
      SESSIONS_API_TOKEN: ${SESSIONS_EXPORT_TOKEN}
      BAN_FILE: "/proxy-data/bans.txt"
    volumes:
      - ./data:/proxy-data
    depends_on:
      - mc
      - backend
    networks:
      - default
