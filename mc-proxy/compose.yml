# mc-proxy: прокси для Minecraft (TCP) и Simple Voice Chat (UDP)
# Авторизация на прокси (read-only копия sessions.db с backend).
# Клиенты подключаются к mc-proxy, прокси проверяет сессию и пересылает на mc-сервер.

services:
  mc-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "24454:24454/udp"
    environment:
      MC_BACKEND: "192.168.1.12:25567"
      VOICE_BACKEND: "192.168.1.12:24456"
      MC_LISTEN: ":25565"
      VOICE_LISTEN: ":24454"
      SESSIONS_DB_PATH: "/data/sessions.db"
      BAN_FILE: "/proxy-data/bans.txt"
    volumes:
      - ../backend/data:/data:ro
      - ./data:/proxy-data
    depends_on:
      - mc
      - backend
    networks:
      - default
