// ============================================================================
// Копирование конфигурационных файлов в папку с исполняемым файлом
// ============================================================================

// Копирование конфигов для native-image (после nativeCompile)
task copyConfigsToNativeImage(type: Copy) {
    dependsOn nativeCompile
    group = 'build'
    description = 'Копирует конфигурационные файлы в папку с native-image исполняемым файлом'
    
    def sourceDir = file('resources/configs')
    def targetDir = file("${buildDir}/native/nativeCompile/configs")
    
    from sourceDir
    into targetDir
    
    doLast {
        println "✓ Конфигурационные файлы скопированы в: ${targetDir.absolutePath}"
    }
}

// Копирование конфигов для JAR (после jar)
task copyConfigsToJar(type: Copy) {
    dependsOn jar
    group = 'build'
    description = 'Копирует конфигурационные файлы в папку с JAR файлом'
    
    def sourceDir = file('resources/configs')
    def targetDir = file("${buildDir}/libs/configs")
    
    from sourceDir
    into targetDir
    
    doLast {
        println "✓ Конфигурационные файлы скопированы в: ${targetDir.absolutePath}"
    }
}

// Автоматически копируем конфиги после сборки
tasks.named('nativeCompile').configure {
    finalizedBy 'copyConfigsToNativeImage'
}

tasks.named('jar').configure {
    finalizedBy 'copyConfigsToJar'
}

// Альтернатива: jpackage для создания нативного установщика с JRE
// Работает лучше для Swing приложений, чем GraalVM Native Image
task jpackage(type: Exec) {
    dependsOn jar
    group = 'distribution'
    description = 'Создает нативный установщик через jpackage (требует JDK 14+)'
    
    def jpackageHome = System.getenv('JAVA_HOME')
    if (jpackageHome == null) {
        throw new GradleException('JAVA_HOME не установлен. Установите JAVA_HOME на JDK 14+')
    }
    
    def jpackageExe = new File(jpackageHome, 'bin/jpackage.exe')
    if (!jpackageExe.exists()) {
        throw new GradleException("jpackage не найден в $jpackageHome. Убедитесь, что используется JDK 14+")
    }
    
    def jarFile = jar.archiveFile.get().asFile
    def outputDir = file("${buildDir}/jpackage")
    
    // Удаляем старую сборку если существует
    doFirst {
        delete outputDir
        println "Создание jpackage образа..."
        println "JAVA_HOME: $jpackageHome"
        println "JAR файл: $jarFile"
        println "Выходная директория: $outputDir"
    }
    
    commandLine jpackageExe,
        '--input', "${buildDir}/libs",
        '--name', 'launcher',
        '--main-jar', jarFile.name,
        '--main-class', 'com.launcher.LauncherFrame',
        '--type', 'app-image',
        '--dest', outputDir,
        '--java-options', '-Xmx512m',
        '--java-options', '-Dfile.encoding=UTF-8',
        '--app-version', project.version,
        '--vendor', 'Launcher',
        '--description', 'Minecraft Launcher',
        '--win-console'  // Показывать консоль для отладки
    
    // Обработка ошибок
    doLast {
        def exeFile = new File(outputDir, "launcher/launcher.exe")
        if (exeFile.exists()) {
            println "✓ Успешно создан: ${exeFile.absolutePath}"
        } else {
            throw new GradleException("Ошибка: исполняемый файл не создан в ${exeFile.absolutePath}")
        }
    }
}