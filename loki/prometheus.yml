global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: launcher-backend

  - job_name: mc-monitor
    static_configs:
      - targets:
          - mc-monitor:8080
        labels:
          service: minecraft

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: containers
