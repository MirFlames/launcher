# Вариант с mc-proxy: клиенты подключаются к прокси, mc-сервер без проброса портов.
# Авторизация на прокси (read-only sessions.db с backend).
# Мод launcher_auth на mc-сервере можно удалить — проверка в прокси.
#
# Запуск: docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build

include:
  - mc-proxy/compose.yml

services:
  mc:
    ports: []  # Прокси занимает 25565 и 24454
