# GET /api/jdk/info - Информация о JDK
get:
  tags:
    - JDK
  summary: Получить информацию о требуемом JDK
  description: |
    Возвращает конфигурацию JDK для запуска Minecraft.
    Лаунчер использует эти данные для проверки/установки правильной версии Java.
  operationId: getJDKInfo
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: '../schemas/jdk.yaml#/JDKInfo'
    '405':
      description: Метод не разрешён
