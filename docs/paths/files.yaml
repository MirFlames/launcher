# GET /files/{path} - Скачивание файлов
get:
  tags:
    - Files
  summary: Скачать файл
  description: |
    Скачивание файлов по относительному пути.
    Используется для загрузки модов, клиентских файлов, лаунчера.
    Поддерживает Accept-Ranges для докачки.
  operationId: downloadFile
  parameters:
    - name: path
      in: path
      required: true
      description: Относительный путь к файлу (например mods/fabric-api.jar)
      schema:
        type: string
      example: "mods/fabric-api-0.141.1+1.21.11.jar"
  responses:
    '200':
      description: Файл успешно отправлен
      headers:
        Content-Type:
          schema:
            type: string
            example: application/octet-stream
        Content-Length:
          schema:
            type: integer
        Accept-Ranges:
          schema:
            type: string
            example: bytes
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      description: Недопустимый путь или путь к директории
    '404':
      description: Файл не найден
    '405':
      description: Метод не разрешён
