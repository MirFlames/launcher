# Схемы для API версии игры

ServerInfo:
  type: object
  description: Информация о версии Minecraft, файлах клиента и модах
  required:
    - minecraft_version
    - mods_hash
    - client_files
    - mods
  properties:
    minecraft_version:
      type: string
      description: Версия Minecraft / Fabric Loader
      example: "fabric-loader-0.18.4-1.21.11"
    mods_hash:
      type: string
      description: Агрегированный хеш списка модов (для быстрой проверки)
    client_files:
      type: array
      description: Список обязательных файлов клиента
      items:
        $ref: './common.yaml#/ClientFile'
    mods:
      type: array
      description: Список модов
      items:
        $ref: './common.yaml#/ModFile'
