# Общие схемы данных Backend API
# Launcher Server - конфигурация Minecraft, модов, лаунчера и JDK

ClientFile:
  type: object
  description: Файл клиента (загрузчик Fabric, конфигурация и т.д.)
  required:
    - name
    - url
    - hash
  properties:
    name:
      type: string
      description: Имя файла
      example: "fabric-loader-0.18.4-1.21.11.jar"
    url:
      type: string
      format: uri
      description: URL для скачивания
      example: "http://localhost:8080/files/versions/fabric-loader-0.18.4-1.21.11/fabric-loader-0.18.4-1.21.11.jar"
    hash:
      type: string
      description: SHA-256 хеш файла
      example: "1473c9489ac50fda3c435049a76a70d61a10b8610db27f5ba9d8756b686cd3bd"

ModFile:
  type: object
  description: Файл мода
  required:
    - name
    - url
    - hash
  properties:
    name:
      type: string
      description: Имя файла мода
      example: "fabric-api-0.141.1+1.21.11.jar"
    url:
      type: string
      format: uri
      description: URL для скачивания
    hash:
      type: string
      description: SHA-256 хеш файла

Error:
  type: object
  description: Сообщение об ошибке
  properties:
    message:
      type: string
      description: Текстовое описание ошибки
