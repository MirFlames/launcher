openapi: 3.0.3
info:
  title: Launcher Backend API
  description: |
    API сервера для Minecraft-лаунчера. Предоставляет:
    - конфигурацию версии игры и модов
    - информацию об обновлениях лаунчера
    - параметры JDK
    - раздачу файлов (моды, загрузчик, лаунчер)
  version: 1.0.0
  contact:
    name: Launcher Project

servers:
  - url: http://localhost:8080
    description: Локальная разработка
  - url: http://localhost:80
    description: Локальная разработка (порт 80)

tags:
  - name: Version
    description: Версия Minecraft и конфигурация клиента
  - name: Launcher
    description: Обновления лаунчера
  - name: JDK
    description: Конфигурация Java/JDK
  - name: Files
    description: Скачивание файлов

paths:
  /api/version:
    $ref: './paths/version.yaml'
  /api/launcher/version:
    $ref: './paths/launcher.yaml'
  /api/jdk/info:
    $ref: './paths/jdk.yaml'
  /files/{path}:
    $ref: './paths/files.yaml'
