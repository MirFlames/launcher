// Build.gradle для Go проекта backend
plugins {
    id 'base'
}

// Проверка наличия Go
def goExecutable = System.getenv('GOROOT') ? 
    new File(System.getenv('GOROOT'), 'bin/go.exe').absolutePath : 
    'go'

task checkGo {
    group = 'verification'
    description = 'Проверяет наличие Go в системе'
    doLast {
        try {
            def process = new ProcessBuilder(goExecutable, 'version')
                .redirectErrorStream(true)
                .start()
            def output = new StringBuilder()
            def reader = new BufferedReader(new InputStreamReader(process.inputStream))
            String line
            while ((line = reader.readLine()) != null) {
                output.append(line).append('\n')
            }
            process.waitFor()
            if (process.exitValue() == 0) {
                println "✓ Go найден: ${output.toString().trim()}"
            } else {
                throw new GradleException("Go не найден или не работает. Установите Go и добавьте его в PATH.")
            }
        } catch (Exception e) {
            throw new GradleException("Go не найден. Установите Go и добавьте его в PATH. Ошибка: ${e.message}")
        }
    }
}

// Загрузка зависимостей Go
task goModDownload(type: Exec) {
    group = 'build'
    description = 'Загружает зависимости Go модуля'
    dependsOn checkGo
    workingDir = projectDir
    commandLine goExecutable, 'mod', 'download'
    
    doFirst {
        println "Загрузка зависимостей Go..."
    }
    
    doLast {
        println "✓ Зависимости загружены"
    }
}

// Обновление зависимостей
task goModTidy(type: Exec) {
    group = 'build'
    description = 'Обновляет go.mod и go.sum файлы'
    dependsOn checkGo
    workingDir = projectDir
    commandLine goExecutable, 'mod', 'tidy'
    
    doFirst {
        println "Обновление go.mod..."
    }
    
    doLast {
        println "✓ go.mod обновлен"
    }
}

// Форматирование кода
task goFmt(type: Exec) {
    group = 'verification'
    description = 'Форматирует Go код'
    dependsOn checkGo
    workingDir = projectDir
    commandLine goExecutable, 'fmt', './...'
    
    doFirst {
        println "Форматирование Go кода..."
    }
    
    doLast {
        println "✓ Код отформатирован"
    }
}

// Проверка кода (go vet)
task goVet(type: Exec) {
    group = 'verification'
    description = 'Проверяет Go код на ошибки'
    dependsOn checkGo
    workingDir = projectDir
    commandLine goExecutable, 'vet', './...'
    
    doFirst {
        println "Проверка Go кода..."
    }
    
    doLast {
        println "✓ Код проверен"
    }
}

// Запуск тестов
task goTest(type: Exec) {
    group = 'verification'
    description = 'Запускает Go тесты'
    dependsOn checkGo, goModDownload
    workingDir = projectDir
    commandLine goExecutable, 'test', './...', '-v'
    
    doFirst {
        println "Запуск Go тестов..."
    }
    
    doLast {
        println "✓ Тесты выполнены"
    }
}

// Сборка Go приложения
task goBuild(type: Exec) {
    group = 'build'
    description = 'Собирает Go приложение'
    dependsOn checkGo, goModDownload
    workingDir = projectDir
    
    def outputDir = file("${buildDir}/bin")
    def outputFile = file("${outputDir}/backend${System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''}")
    
    outputs.file(outputFile)
    
    // Определяем имя бинарного файла в зависимости от ОС
    def binaryName = 'backend'
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        binaryName = 'backend.exe'
    }
    
    commandLine goExecutable, 'build', '-o', outputFile.absolutePath, '.'
    
    doFirst {
        outputDir.mkdirs()
        println "Сборка Go приложения..."
        println "Выходной файл: ${outputFile.absolutePath}"
    }
    
    doLast {
        if (outputFile.exists()) {
            println "✓ Приложение собрано: ${outputFile.absolutePath}"
        } else {
            throw new GradleException("Ошибка: исполняемый файл не создан")
        }
    }
}

// Сборка для разных платформ
task goBuildWindows(type: Exec) {
    group = 'build'
    description = 'Собирает Go приложение для Windows'
    dependsOn checkGo, goModDownload
    workingDir = projectDir
    
    def outputDir = file("${buildDir}/bin/windows")
    def outputFile = file("${outputDir}/backend.exe")
    
    outputs.file(outputFile)
    
    commandLine goExecutable, 'build', '-o', outputFile.absolutePath, '.'
    
    environment 'GOOS', 'windows'
    environment 'GOARCH', 'amd64'
    
    doFirst {
        outputDir.mkdirs()
        println "Сборка для Windows..."
    }
    
    doLast {
        println "✓ Windows версия собрана: ${outputFile.absolutePath}"
    }
}

task goBuildLinux(type: Exec) {
    group = 'build'
    description = 'Собирает Go приложение для Linux'
    dependsOn checkGo, goModDownload
    workingDir = projectDir
    
    def outputDir = file("${buildDir}/bin/linux")
    def outputFile = file("${outputDir}/backend")
    
    outputs.file(outputFile)
    
    commandLine goExecutable, 'build', '-o', outputFile.absolutePath, '.'
    
    environment 'GOOS', 'linux'
    environment 'GOARCH', 'amd64'
    
    doFirst {
        outputDir.mkdirs()
        println "Сборка для Linux..."
    }
    
    doLast {
        println "✓ Linux версия собрана: ${outputFile.absolutePath}"
    }
}

// Запуск приложения
task goRun(type: Exec) {
    group = 'application'
    description = 'Запускает Go приложение'
    dependsOn checkGo, goModDownload
    workingDir = projectDir
    commandLine goExecutable, 'run', '.'
    
    doFirst {
        println "Запуск Go приложения..."
    }
}

// Переопределяем стандартные задачи, предоставляемые плагином base
tasks.named('build') {
    group = 'build'
    description = 'Собирает Go приложение'
    dependsOn goBuild
}

// Плагин base не создает задачу test, поэтому создаем её напрямую
task test {
    group = 'verification'
    description = 'Запускает Go тесты'
    dependsOn goTest
}

// Плагин base не создает задачу run, поэтому создаем её напрямую
task run(type: Exec) {
    group = 'application'
    description = 'Запускает Go приложение локально'
    dependsOn checkGo, goModDownload
    workingDir = projectDir
    commandLine goExecutable, 'run', '.'
    
    doFirst {
        println "Запуск Go приложения..."
    }
}

tasks.named('clean') {
    group = 'build'
    description = 'Очищает собранные файлы'
    doLast {
        delete "${buildDir}/bin"
        println "✓ Очистка завершена"
    }
}

// Задача для сборки всех платформ
task buildAll {
    group = 'build'
    description = 'Собирает приложение для всех платформ'
    dependsOn goBuildWindows, goBuildLinux
}
