name: Build & Release Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────
  # Общая информация о версии (нужна во всех job)
  # ─────────────────────────────────────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mandatory: ${{ steps.version.outputs.mandatory }}
      min_mandatory_version: ${{ steps.version.outputs.min_mandatory_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version and mandatory flag from tag
        id: version
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          RAW_TAG="${TAG_NAME}"
          CLEAN="${RAW_TAG#v}"
          CLEAN="${CLEAN%-critical}"
          echo "version=$CLEAN" >> $GITHUB_OUTPUT

          if [[ "$RAW_TAG" == *"-critical" ]]; then
            echo "mandatory=true" >> $GITHUB_OUTPUT
          else
            echo "mandatory=false" >> $GITHUB_OUTPUT
          fi

          LAST_CRIT=""
          TAGS_JSON=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/git/refs/tags?per_page=100" || true)
          if [[ -n "$TAGS_JSON" ]] && [[ "$TAGS_JSON" != "[]" ]]; then
            LAST_CRIT=$(printf '%s' "$TAGS_JSON" \
              | grep -oE '"ref"[[:space:]]*:[[:space:]]*"refs/tags/[^"]+' \
              | sed 's/.*refs\/tags\///' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-critical$' \
              | sed 's/-critical$//' \
              | sort -V | tail -1 || true)
          fi
          if [[ -n "$LAST_CRIT" ]]; then
            echo "min_mandatory_version=${LAST_CRIT#v}" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────
  # Windows build
  # ─────────────────────────────────────────────
  build-windows:
    needs: meta
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore code signing cert (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          if ($env:PFX_B64) {
            $bytes = [Convert]::FromBase64String($env:PFX_B64)
            $path = "$env:USERPROFILE\codesign-ci.pfx"
            [IO.File]::WriteAllBytes($path, $bytes)
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CODESIGN_PFX=$path`n", $utf8)
            if ($env:PFX_PASS) {
              $p = $env:PFX_PASS -replace "`n|`r", ''
              [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CODESIGN_PASSWORD=$p`n", $utf8)
            }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/launcher/frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend deps
        working-directory: client/launcher/frontend
        run: npm ci

      - name: Build launcher (Windows)
        working-directory: client/launcher
        shell: pwsh
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update-windows.json
          UPDATE_SIGNATURE_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update-windows.json.sig
          UPDATE_PUBLIC_KEY_HEX: ${{ secrets.LAUNCHER_UPDATE_PUBLIC_KEY_HEX }}
        run: ./build.ps1 build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        working-directory: client/launcher/installer
        shell: pwsh
        run: |
          foreach ($f in @('assets\wizard-large.bmp', 'assets\wizard-small.bmp')) {
            if (-not (Test-Path $f)) { throw "Missing wizard image: $f" }
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "launcher.iss" "/DAppVersion=$env:VERSION"

      - name: Sign installer (optional)
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "minecraft-online-setup.exe"
          if (-not (Test-Path $setup) -or -not $env:CODESIGN_PFX) { exit 0 }
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -EA SilentlyContinue |
            Sort-Object { $_.Directory.Name } -Desc | Select-Object -First 1 -Expand FullName
          if (-not $st) { $st = "signtool.exe" }
          & $st sign /f $env:CODESIGN_PFX /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $setup
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }

      - name: Package artifacts
        shell: pwsh
        run: |
          Copy-Item "client/launcher/build/bin/launcher.exe" "launcher.exe" -Force
          Compress-Archive -Path "launcher.exe" -DestinationPath "launcher-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            launcher-windows.zip
            minecraft-online-setup.exe

  # ─────────────────────────────────────────────
  # macOS build
  # ─────────────────────────────────────────────
  build-macos:
    needs: meta
    runs-on: macos-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/launcher/frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend deps
        working-directory: client/launcher/frontend
        run: npm ci

      - name: Build launcher (macOS)
        working-directory: client/launcher
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update-macos.json
          UPDATE_SIGNATURE_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update-macos.json.sig
          UPDATE_PUBLIC_KEY_HEX: ${{ secrets.LAUNCHER_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          LDFLAGS="-s -w"
          [ -n "$API_BASE_URL" ]      && LDFLAGS="$LDFLAGS -X main.buildDefaultApiBaseUrl=$API_BASE_URL"
          [ -n "$SERVER_HOST" ]       && LDFLAGS="$LDFLAGS -X main.buildDefaultServerHost=$SERVER_HOST"
          [ -n "$SERVER_PORT" ]       && LDFLAGS="$LDFLAGS -X main.buildDefaultServerPort=$SERVER_PORT"
          [ -n "$UPDATE_MANIFEST_URL" ] && LDFLAGS="$LDFLAGS -X main.buildUpdateManifestURL=$UPDATE_MANIFEST_URL"
          [ -n "$UPDATE_SIGNATURE_URL" ] && LDFLAGS="$LDFLAGS -X main.buildUpdateSignatureURL=$UPDATE_SIGNATURE_URL"
          [ -n "$UPDATE_PUBLIC_KEY_HEX" ] && LDFLAGS="$LDFLAGS -X main.buildUpdatePublicKeyHex=$UPDATE_PUBLIC_KEY_HEX"
          # universal, а не amd64: на Apple Silicon под Rosetta runtime.GOARCH вернёт amd64,
          # и лаунчер скачает x64-JDK — вся игра поедет через трансляцию.
          wails build -platform darwin/universal -ldflags "$LDFLAGS" -trimpath

      # Только после сборки: main.go содержит //go:embed all:frontend/dist,
      # а frontend/dist создаётся wails-сборкой и лежит в .gitignore —
      # до неё пакет просто не компилируется.
      # На Unix эти тесты ценнее всего: проверки прав доступа и симлинков
      # при распаковке JDK на Windows вырождаются в no-op.
      - name: Run Go tests
        working-directory: client/launcher
        run: CGO_ENABLED=0 go test ./...

      - name: Code sign (optional)
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          APP="client/launcher/build/bin/launcher.app"
          if [ -n "$APPLE_CERT_B64" ]; then
            echo "$APPLE_CERT_B64" | base64 --decode > /tmp/cert.p12
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
            codesign --deep --force --verify --sign "Developer ID Application" "$APP"
          fi

      - name: Package artifacts
        run: |
          APP="client/launcher/build/bin/launcher.app"
          BIN="$APP/Contents/MacOS/launcher"

          # ZIP с бинарником для автообновления
          zip -j launcher-macos.zip "$BIN"

          # DMG для ручной установки
          mkdir -p dmg_stage
          cp -R "$APP" dmg_stage/
          hdiutil create -volname "Minecraft Launcher" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            launcher-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            launcher-macos.zip
            launcher-macos.dmg

  # ─────────────────────────────────────────────
  # Linux build
  # ─────────────────────────────────────────────
  build-linux:
    needs: meta
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/launcher/frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install system dependencies (WebKit)
        run: |
          sudo apt-get update -qq
          # Ubuntu 24.04+ использует libwebkit2gtk-4.1-dev, более ранние — 4.0-dev
          if apt-cache show libwebkit2gtk-4.1-dev &>/dev/null; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            "$WEBKIT_PKG" \
            pkg-config \
            gcc

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend deps
        working-directory: client/launcher/frontend
        run: npm ci

      - name: Build launcher (Linux)
        working-directory: client/launcher
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update-linux.json
          UPDATE_SIGNATURE_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update-linux.json.sig
          UPDATE_PUBLIC_KEY_HEX: ${{ secrets.LAUNCHER_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          LDFLAGS="-s -w"
          [ -n "$API_BASE_URL" ]      && LDFLAGS="$LDFLAGS -X main.buildDefaultApiBaseUrl=$API_BASE_URL"
          [ -n "$SERVER_HOST" ]       && LDFLAGS="$LDFLAGS -X main.buildDefaultServerHost=$SERVER_HOST"
          [ -n "$SERVER_PORT" ]       && LDFLAGS="$LDFLAGS -X main.buildDefaultServerPort=$SERVER_PORT"
          [ -n "$UPDATE_MANIFEST_URL" ] && LDFLAGS="$LDFLAGS -X main.buildUpdateManifestURL=$UPDATE_MANIFEST_URL"
          [ -n "$UPDATE_SIGNATURE_URL" ] && LDFLAGS="$LDFLAGS -X main.buildUpdateSignatureURL=$UPDATE_SIGNATURE_URL"
          [ -n "$UPDATE_PUBLIC_KEY_HEX" ] && LDFLAGS="$LDFLAGS -X main.buildUpdatePublicKeyHex=$UPDATE_PUBLIC_KEY_HEX"
          # На Ubuntu 24.04+ WebKit называется 4.1, передаём тег сборки Wails
          if pkg-config --exists webkit2gtk-4.1 2>/dev/null; then
            EXTRA_TAGS="-tags webkit2_41"
          else
            EXTRA_TAGS=""
          fi
          wails build -platform linux/amd64 -ldflags "$LDFLAGS" -trimpath $EXTRA_TAGS

      # После сборки — см. пояснение в job build-macos (//go:embed frontend/dist).
      - name: Run Go tests
        working-directory: client/launcher
        run: CGO_ENABLED=0 go test ./...

      - name: Package artifacts
        run: |
          BIN="client/launcher/build/bin/launcher"
          chmod +x "$BIN"

          # ZIP для автообновления
          zip -j launcher-linux.zip "$BIN"

          # TAR.GZ для ручной установки
          tar -czf launcher-linux.tar.gz -C "$(dirname $BIN)" launcher

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            launcher-linux.zip
            launcher-linux.tar.gz

  # ─────────────────────────────────────────────
  # Release job — собирает всё вместе
  # ─────────────────────────────────────────────
  release:
    needs: [meta, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}
      MANDATORY: ${{ needs.meta.outputs.mandatory }}
      MIN_MANDATORY: ${{ needs.meta.outputs.min_mandatory_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: macos-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi
          CHANGELOG=$(git log --oneline "$RANGE" || echo "Initial release")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Compute SHA256 hashes
        run: |
          echo "SHA256_WINDOWS=$(sha256sum launcher-windows.zip | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "SHA256_MACOS=$(sha256sum launcher-macos.zip | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "SHA256_LINUX=$(sha256sum launcher-linux.zip | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Generate update manifests
        run: |
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          ESCAPED=$(printf '%s' "$CHANGELOG" | jq -Rs .)

          for PLATFORM in windows macos linux; do
            case $PLATFORM in
              windows) SHA="$SHA256_WINDOWS" ;;
              macos)   SHA="$SHA256_MACOS" ;;
              linux)   SHA="$SHA256_LINUX" ;;
            esac

            cat > "launcher-update-${PLATFORM}.json" <<EOF
          {
            "version": "${VERSION}",
            "mandatory": ${MANDATORY},
            "min_mandatory_version": "${MIN_MANDATORY}",
            "changelog": ${ESCAPED},
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/launcher-${PLATFORM}.zip",
            "size": 0,
            "sha256": "${SHA}"
          }
          EOF
            echo "Generated launcher-update-${PLATFORM}.json"
          done

          # Алиас для обратной совместимости со старыми Windows-клиентами (≤1.0.40).
          cp launcher-update-windows.json launcher-update.json

      - name: Sign manifests (Ed25519)
        run: |
          echo "${{ secrets.LAUNCHER_UPDATE_PRIVATE_KEY }}" > private.pem
          for PLATFORM in windows macos linux; do
            # -rawin обязателен для Ed25519 в OpenSSL 3.x (данные передаются без предварительного хэширования)
            openssl pkeyutl -sign -rawin -inkey private.pem \
              -in "launcher-update-${PLATFORM}.json" \
              -out "launcher-update-${PLATFORM}.sig.bin"
            xxd -p -c 256 "launcher-update-${PLATFORM}.sig.bin" | tr -d '\n' > "launcher-update-${PLATFORM}.json.sig"
            rm -f "launcher-update-${PLATFORM}.sig.bin"
          done
          # Алиас подписи для старых клиентов.
          cp launcher-update-windows.json.sig launcher-update.json.sig
          rm -f private.pem

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="${{ steps.changelog.outputs.changelog }}"
          gh release create "$TAG_NAME" \
            "launcher-windows.zip" \
            "minecraft-online-setup.exe" \
            "launcher-macos.zip" \
            "launcher-macos.dmg" \
            "launcher-linux.zip" \
            "launcher-linux.tar.gz" \
            "launcher-update-windows.json" \
            "launcher-update-windows.json.sig" \
            "launcher-update-macos.json" \
            "launcher-update-macos.json.sig" \
            "launcher-update-linux.json" \
            "launcher-update-linux.json.sig" \
            "launcher-update.json" \
            "launcher-update.json.sig" \
            --title "Launcher $TAG_NAME" \
            --notes "$NOTES" \
            --verify-tag
