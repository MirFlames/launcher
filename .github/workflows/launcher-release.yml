name: Build & Release Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version and mandatory flag from tag
        id: version
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG="${TAG_NAME}"
          CLEAN="${RAW_TAG#v}"
          CLEAN="${CLEAN%-critical}"
          echo "version=$CLEAN" >> $GITHUB_OUTPUT

          if [[ "$RAW_TAG" == *"-critical" ]]; then
            echo "mandatory=true" >> $GITHUB_OUTPUT
          else
            echo "mandatory=false" >> $GITHUB_OUTPUT
          fi

          # Последняя критичная версия — curl + GitHub API (gh часто недоступен в Git Bash на Windows).
          LAST_CRIT=""
          TAGS_JSON=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${REPO}/git/refs/tags?per_page=100" || true)
          echo "API response length: ${#TAGS_JSON}"
          if [[ -n "$TAGS_JSON" ]] && [[ "$TAGS_JSON" != "[]" ]]; then
            LAST_CRIT=$(printf '%s' "$TAGS_JSON" | grep -oE '"ref"[[:space:]]*:[[:space:]]*"refs/tags/[^"]+' | sed 's/.*refs\/tags\///' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-critical$' | sed 's/-critical$//' | sort -V | tail -1 || true)
          fi
          echo "last_critical_version: ${LAST_CRIT:-<empty>}"
          if [[ -n "$LAST_CRIT" ]]; then
            CLEAN_CRIT="${LAST_CRIT#v}"
            echo "min_mandatory_version=$CLEAN_CRIT" >> $GITHUB_OUTPUT
          fi

      - name: Restore code signing cert (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          if ($env:PFX_B64) {
            Write-Host "Restoring code signing certificate from secret..."
            $bytes = [Convert]::FromBase64String($env:PFX_B64)
            $path = "$env:USERPROFILE\codesign-ci.pfx"
            [IO.File]::WriteAllBytes($path, $bytes)
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CODESIGN_PFX=$path`n", $utf8)
            if ($env:PFX_PASS) {
              $p = $env:PFX_PASS -replace "`n|`r", ''
              [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CODESIGN_PASSWORD=$p`n", $utf8)
            }
          } else {
            Write-Host "CODESIGN_PFX_BASE64 secret not set. Skipping signing in CI." -ForegroundColor Yellow
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/launcher/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend deps
        working-directory: client/launcher/frontend
        run: npm ci

      - name: Build launcher via build.ps1
        working-directory: client/launcher
        shell: pwsh
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update.json
          UPDATE_SIGNATURE_URL: https://github.com/${{ github.repository }}/releases/latest/download/launcher-update.json.sig
          UPDATE_PUBLIC_KEY_HEX: ${{ secrets.LAUNCHER_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          ./build.ps1 build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer (Inno Setup)
        working-directory: client/launcher/installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./generate-wizard-images.ps1
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          & $iscc "launcher.iss" "/DAppVersion=$env:APP_VERSION"

      - name: Sign installer (optional)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          SETUP_VER: ${{ steps.version.outputs.version }}
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "Launcher-Setup-$($env:SETUP_VER).exe"
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }
          if (-not $env:CODESIGN_PFX) {
            Write-Host "No code signing cert; skipping setup.exe signing." -ForegroundColor Yellow
            exit 0
          }
          $SignToolPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { $_.Directory.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $SignToolPath) { $SignToolPath = "signtool.exe" }
          Write-Host "Signing $setup with $SignToolPath"
          & $SignToolPath sign /f $env:CODESIGN_PFX /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $setup
          if ($LASTEXITCODE -ne 0) { throw "Signing setup failed with exit $LASTEXITCODE" }

      - name: Prepare release artifacts (zip)
        shell: pwsh
        run: |
          Copy-Item "client/launcher/build/bin/launcher.exe" "launcher.exe" -Force
          Compress-Archive -Path "launcher.exe" -DestinationPath "launcher.zip" -Force

      - name: Compute SHA256 of launcher.zip
        shell: bash
        run: |
          HASH_LINE=$(sha256sum launcher.zip)
          HASH="${HASH_LINE%% *}"
          echo "LAUNCHER_SHA256=$HASH" >> $GITHUB_ENV

      - name: Generate changelog from git log
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi
          CHANGELOG=$(git log --oneline "$RANGE" || echo "Initial release")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate launcher-update.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MANDATORY="${{ steps.version.outputs.mandatory }}"
          MIN_MANDATORY="${{ steps.version.outputs.min_mandatory_version }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          SHA256="${LAUNCHER_SHA256}"

          # Безопасно экранируем многострочный changelog в JSON-строку.
          # jq -Rs . превращает stdin в корректный JSON string (с \n, кавычками и т.п.).
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -Rs .)

          cat > launcher-update.json <<EOF
          {
            "version": "${VERSION}",
            "mandatory": ${MANDATORY},
            "min_mandatory_version": "${MIN_MANDATORY}",
            "changelog": ${ESCAPED_CHANGELOG},
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/launcher.zip",
            "size": 0,
            "sha256": "${SHA256}"
          }
          EOF

          echo "Generated launcher-update.json:"
          cat launcher-update.json

      - name: Sign launcher-update.json (Ed25519, hex)
        shell: bash
        run: |
          echo "${{ secrets.LAUNCHER_UPDATE_PRIVATE_KEY }}" > private.pem
          openssl pkeyutl -sign -inkey private.pem -in launcher-update.json -out launcher-update.sig.bin
          xxd -p -c 256 launcher-update.sig.bin | tr -d '\n' > launcher-update.json.sig
          rm -f launcher-update.sig.bin private.pem

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_TAG="${TAG_NAME}"
          TITLE="Launcher ${VERSION_TAG}"
          NOTES="${{ steps.changelog.outputs.changelog }}"

          SETUP="Launcher-Setup-${{ steps.version.outputs.version }}.exe"
          gh release create "$VERSION_TAG" \
            "launcher.zip" \
            "$SETUP" \
            "launcher-update.json" \
            "launcher-update.json.sig" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --verify-tag

